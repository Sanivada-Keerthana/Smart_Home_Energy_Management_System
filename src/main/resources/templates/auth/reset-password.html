<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password | Smart Residential Energy Management System</title>

<style>
:root {
    --primary: #667eea;
    --secondary: #764ba2;
    --dark: #2c2c2c;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    min-height: 100vh;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    display: flex;
    flex-direction: column;
}

/* HEADER */
header {
    background: rgba(255,255,255,0.95);
    padding: 12px 0;
    text-align: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

header img { width: 90px; }
header h1 { font-size: 22px; color: var(--dark); }

/* CENTER */
.container {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* CARD */
.card {
    background: rgba(255,255,255,0.97);
    width: 100%;
    max-width: 460px;
    padding: 40px 35px;
    border-radius: 14px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
}

/* TITLES */
.title { text-align: center; margin-bottom: 25px; }
.title h2 { font-size: 26px; }
.title p { font-size: 14px; color: #666; }

/* MESSAGES */
.message {
    display: none;
    padding: 12px;
    border-radius: 6px;
    margin-bottom: 15px;
}
.message.show { display: block; }
.error { background: #ffeaea; color: #c62828; }
.success { background: #eaffea; color: #2e7d32; }

/* FORM */
.form-group { margin-bottom: 18px; }
label { font-weight: 600; display: block; margin-bottom: 6px; }

input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 8px;
    border: 2px solid #ddd;
}

/* STRENGTH */
.strength-bar {
    height: 5px;
    background: #e0e0e0;
    margin-top: 6px;
}
.strength-indicator {
    height: 100%;
    width: 0;
}

/* BUTTON */
button {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    color: white;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
}

/* FOOTER */
footer {
    background: rgba(255,255,255,0.9);
    padding: 10px;
    text-align: center;
    font-size: 13px;
}
</style>
</head>

<body>

<header>
    <img src="/images/srems_logo.png" alt="Logo">
    <h1>Smart Residential Energy Management System</h1>
</header>

<div class="container">
<div class="card">

<div class="title">
    <h2>Reset Password</h2>
    <p>Create a new secure password</p>
</div>

<div id="errorMessage" class="message error"></div>
<div id="successMessage" class="message success"></div>

<form onsubmit="handleReset(event)">
    <input type="hidden" id="token">

    <div class="form-group" style="position:relative;">
        <label>New Password</label>
        <input type="password" id="newPassword" oninput="checkStrength()" required>
        <img id="toggleNewPassword" src="/images/open_eye.png"
             onclick="toggleField('newPassword','toggleNewPassword')"
             style="position:absolute; right:14px; top:38px; width:20px; cursor:pointer;">
        <div class="strength-bar">
            <div id="strengthIndicator" class="strength-indicator"></div>
        </div>
    </div>

    <div class="form-group" style="position:relative;">
        <label>Confirm Password</label>
        <input type="password" id="confirmPassword" required>
        <img id="toggleConfirmPassword" src="/images/open_eye.png"
             onclick="toggleField('confirmPassword','toggleConfirmPassword')"
             style="position:absolute; right:14px; top:38px; width:20px; cursor:pointer;">
    </div>

    <button>Reset Password</button>
</form>

</div>
</div>

<footer>© 2026 Smart Residential Energy Management System</footer>

<script>
const API_URL = "http://localhost:8081/api/auth";

// token from URL
const params = new URLSearchParams(window.location.search);
token.value = params.get("token");

function checkStrength(){
    const p = newPassword.value;
    let s = 0;
    if (p.length >= 8) s += 25;
    if (/[A-Z]/.test(p)) s += 25;
    if (/[a-z]/.test(p)) s += 25;
    if (/\d/.test(p)) s += 25;

    strengthIndicator.style.width = s + "%";
    strengthIndicator.style.background = s < 50 ? "red" : s < 75 ? "orange" : "green";
}

async function handleReset(e){
    e.preventDefault();

    if (newPassword.value !== confirmPassword.value) {
        showError("Passwords do not match");
        return;
    }

    const res = await fetch(`${API_URL}/reset-password`, {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({
            token: token.value,
            newPassword: newPassword.value,
            confirmPassword: confirmPassword.value
        })
    });

    const data = await res.json();

    if (res.ok && data.success) {
        showSuccess("Password reset successful! Redirecting...");
        setTimeout(() => location.href="/login", 1500);
    } else {
        showError(data.message || "Reset failed");
    }
}

function showError(m){
    errorMessage.textContent = m;
    errorMessage.classList.add("show");
}
function showSuccess(m){
    successMessage.textContent = m;
    successMessage.classList.add("show");
}

// Toggle password visibility
function toggleField(fieldId, imgId) {
    const f = document.getElementById(fieldId);
    const img = document.getElementById(imgId);
    if (!f || !img) return;
    if (f.type === 'password') {
        f.type = 'text';
        img.src = '/images/closed_eye.png';
    } else {
        f.type = 'password';
        img.src = '/images/open_eye.png';
    }
}
</script>

</body>
</html>

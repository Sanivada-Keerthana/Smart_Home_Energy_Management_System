<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
  <h1 class="text-2xl font-bold">Analytics</h1>

  <div class="card" style="margin-top:16px">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h2>Device Energy</h2>
      <div style="display:flex;gap:8px;align-items:center">
        <select id="deviceSelect"></select>

        <!-- Display mode: cumulative totals or per-sample rate (delta) -->
        <select id="modeSelect" title="Display mode">
          <option value="cumulative">Cumulative</option>
          <option value="rate">Rate (kWh/sample)</option>
        </select>

        <button id="refreshBtn" class="btn">Refresh</button>
      </div>
    </div>

    <div style="margin-top:12px">
      <canvas id="deviceChart" height="120"></canvas>
    </div>

    <div id="deviceInfo" style="margin-top:12px">Select a device to view energy over time.</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="/js/analytics-user.js"></script>
</div>
</body>
</html>

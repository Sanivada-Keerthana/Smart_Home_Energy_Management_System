<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title th:text="${pageTitle} ?: 'Admin Dashboard'">Admin Dashboard</title>

<link rel="stylesheet" th:href="@{/css/admin.css}">

<style>
:root{
  --primary:#4f46e5;
  --secondary:#6366f1;
  --bg:#f4f6fb;
  --card:#ffffff;
  --border:#e5e7eb;
  --text:#1f2937;
  --muted:#6b7280;
  --success:#22c55e;
  --shadow:0 12px 28px rgba(0,0,0,.12);
}

*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
body{background:var(--bg);color:var(--text);}
.app{display:flex;min-height:100vh;}

/* SIDEBAR */
.sidebar{
  width:260px;
  background:#fff;
  border-right:1px solid var(--border);
  padding:20px 18px;
}

.logo-box{
  display:flex;
  align-items:center;
  gap:10px;
  padding-bottom:18px;
  border-bottom:1px solid var(--border);
}
.logo-box img{width:38px;}
.logo-text h3{font-size:16px;font-weight:800;color:var(--primary);}
.logo-text span{font-size:11px;color:var(--muted);}

.menu{
  margin-top:20px;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.menu a{
  padding:12px;
  border-radius:10px;
  text-decoration:none;
  color:#374151;
  font-weight:600;
}
.menu a.active,
.menu a:hover{
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  color:#fff;
}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;}

/* TOPBAR */
.topbar{
  height:70px;
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 25px;
  color:#fff;
}
.top-right{display:flex;align-items:center;gap:14px;}
.role-pill{
  background:var(--success);
  padding:4px 14px;
  border-radius:999px;
  font-size:13px;
  font-weight:700;
}

.avatar{
  width:36px;height:36px;border-radius:50%;
  border:2px solid #fff;object-fit:cover;
}
.username{font-weight:700;color:#fff;}

/* ===== USER DROPDOWN FIX ===== */

.user-mini{
  position:relative;
  display:flex;
  align-items:center;
  gap:10px;
  cursor:pointer;
}

.dropdown{
  position:absolute;
  top:55px;
  right:0;
  width:190px;
  background:#ffffff;
  border-radius:14px;
  box-shadow:0 20px 40px rgba(0,0,0,.18);
  border:1px solid #e5e7eb;
  overflow:hidden;
  display:none;
  z-index:9999;
}

/* show dropdown */
.user-mini.open .dropdown{
  display:block;
}

.dropdown a{
  display:flex;
  align-items:center;
  gap:10px;
  padding:14px 16px;
  text-decoration:none;
  font-weight:700;
  color:#1f2937;
  transition:0.25s;
}

.dropdown a:hover{
  background:#eef2ff;
  color:#3730a3;
}

/* logout special */
.dropdown a.logout{
  color:#b91c1c;
  border-top:1px solid #e5e7eb;
}

.dropdown a.logout:hover{
  background:#fee2e2;
  color:#7f1d1d;
}

/* CONTENT */
.content{padding:35px;flex:1;}
.footer{
  background:#fff;text-align:center;
  padding:10px;font-size:13px;color:#6b7280;
}
</style>
</head>

<body>
<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="logo-box">
      <img th:src="@{/images/srems_logo.png}">
      <div class="logo-text">
        <h3>SREMS</h3>
        <span>Smart Residential Energy</span>
      </div>
    </div>

    <nav class="menu">
      <a th:href="@{/admin/dashboard}" th:classappend="${activePage=='admin/home'}?'active'">Home</a>
      <a th:href="@{/admin/aptsetup}" th:classappend="${activePage=='admin/aptsetup'}?'active'">Apartment Setup</a>
      <a th:href="@{/admin/approvals}" th:classappend="${activePage=='admin/approvals'}?'active'">Approvals</a>
      <a th:href="@{/admin/energy}" th:classappend="${activePage=='admin/energy'}?'active'">Energy</a>
      <a th:href="@{/admin/users}" th:classappend="${activePage=='admin/users'}?'active'">Users</a>
      <a th:href="@{/admin/settings}" th:classappend="${activePage=='admin/settings'}?'active'">Settings</a>
    </nav>
  </aside>

  <!-- MAIN -->
  <div class="main">

    <!-- TOPBAR -->
    <header class="topbar">
      <span th:text="${headerTitle}">Dashboard</span>

      <div class="top-right">
        <span class="role-pill" th:text="${role}">ADMIN</span>

        <div class="user-mini" id="profileBox">
          <img class="avatar" th:src="@{/images/avatar.png}">
          <span class="username" th:text="${username}">Admin</span>

          <div class="dropdown">
            <a th:href="@{/admin/profile}">
              👤 Profile
            </a>
            <a th:href="@{/logout}" class="logout">
              🚪 Logout              
            </a>
        </div>
        </div>
      </div>
    </header>

    <!-- CONTENT -->
    <main class="content">
      <div th:replace="~{${activePage} :: content}"></div>
    </main>

    <footer class="footer">
      © 2026 Smart Residential Energy Management System
    </footer>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

const box=document.getElementById("profileBox");
box.onclick=e=>{e.stopPropagation();box.classList.toggle("open");}
document.onclick=()=>box.classList.remove("open");

/* PIE */
new Chart(document.getElementById('pieChart'), {
  type: 'pie',
  data: {
    labels: ['Flats', 'Common Areas'],
    datasets: [{
      data: [9300, 3180],
      backgroundColor: ['#4f46e5', '#22c55e']
    }]
  }
});

/* BAR */
new Chart(document.getElementById('barChart'), {
  type: 'bar',
  data: {
    labels: ['Block A', 'Block B', 'Block C'],
    datasets: [{
      data: [4200, 3800, 2480],
      backgroundColor: '#4f46e5'
    }]
  },
  options:{
    plugins:{legend:{display:false}},
    scales:{y:{beginAtZero:true}}
  }
});

function showForm(id) {
  const forms = ['blockForm', 'flatForm', 'commonForm'];

  forms.forEach(f => {
    const el = document.getElementById(f);
    if (el) el.style.display = 'none';
  });

  const target = document.getElementById(id);
  if (target) target.style.display = 'block';
}
</script>

</script>
</body>
</html>

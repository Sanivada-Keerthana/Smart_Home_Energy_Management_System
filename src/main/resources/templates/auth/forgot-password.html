<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password | Smart Residential Energy Management System</title>

<style>
:root {
    --primary: #667eea;
    --secondary: #764ba2;
    --dark: #2c2c2c;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    min-height: 100vh;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    display: flex;
    flex-direction: column;
}

/* HEADER */
header {
    background: rgba(255,255,255,0.95);
    padding: 12px 0;
    text-align: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

header img { width: 90px; }
header h1 { font-size: 22px; color: var(--dark); }

/* CENTER */
.container {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* CARD */
.card {
    background: rgba(255,255,255,0.97);
    width: 100%;
    max-width: 420px;
    padding: 40px 35px;
    border-radius: 14px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
}

/* TITLES */
.title { text-align: center; margin-bottom: 25px; }
.title h2 { font-size: 26px; }
.title p { font-size: 14px; color: #666; }

/* MESSAGES */
.message {
    display: none;
    padding: 12px;
    border-radius: 6px;
    margin-bottom: 15px;
    font-size: 14px;
}
.message.show { display: block; }
.error { background: #ffeaea; color: #c62828; }
.success { background: #eaffea; color: #2e7d32; }

/* FORM */
.form-group { margin-bottom: 18px; }
label { font-weight: 600; display: block; margin-bottom: 6px; }

input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 8px;
    border: 2px solid #ddd;
}

input:focus {
    outline: none;
    border-color: var(--primary);
}

/* BUTTON */
button {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    color: white;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    cursor: pointer;
}

/* LINKS */
.links { margin-top: 18px; text-align: center; }
.links a { color: var(--primary); font-weight: 600; text-decoration: none; }

/* FOOTER */
footer {
    background: rgba(255,255,255,0.9);
    padding: 10px;
    text-align: center;
    font-size: 13px;
    color: #555;
}
</style>
</head>

<body>

<header>
    <img src="/images/srems_logo.png" alt="Logo">
    <h1>Smart Residential Energy Management System</h1>
</header>

<div class="container">
<div class="card">

<div class="title">
    <h2>Forgot Password?</h2>
    <p>Enter your registered email to receive a reset link</p>
</div>

<div id="errorMessage" class="message error"></div>
<div id="successMessage" class="message success"></div>

<form onsubmit="handleForgot(event)">
    <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" required>
    </div>

    <button type="submit" id="sendBtn">Send Reset Link</button>
</form>

<div class="links">
    <a href="/login">Back to Login</a>
</div>

</div>
</div>

<footer>© 2026 Smart Residential Energy Management System</footer>

<script>
const API_URL = "http://localhost:8081/api/auth";

async function handleForgot(e) {
    e.preventDefault();
    sendBtn.disabled = true;

    try {
        const res = await fetch(
            `${API_URL}/forget-password?email=${encodeURIComponent(email.value.trim())}`,
            { method: "POST" }
        );

        const data = await res.json();

        if (res.ok && data.success) {
            showSuccess("If the account exists, a reset link has been sent.");
        } else {
            showError(data.message || "Email not found");
            sendBtn.disabled = false;
        }
    } catch {
        showError("Server error. Try again later.");
        sendBtn.disabled = false;
    }
}

function showError(msg){
    errorMessage.textContent = msg;
    errorMessage.classList.add("show");
}
function showSuccess(msg){
    successMessage.textContent = msg;
    successMessage.classList.add("show");
}
</script>

</body>
</html>

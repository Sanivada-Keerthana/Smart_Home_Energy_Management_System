# =====================================
# Application Configuration
# =====================================
spring.application.name=srems
server.port=8081


# =====================================
# Load Secret Properties (DO NOT COMMIT)
# =====================================
spring.config.import=optional:application-secret.properties


# =====================================
# Database Configuration
# =====================================
spring.datasource.url=jdbc:mysql://localhost:3306/srems_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =====================================
# JPA / Hibernate
# =====================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect   ❌ REMOVE THIS


# =====================================
# Thymeleaf
# =====================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html


# =====================================
# Static Resources
# =====================================
spring.web.resources.static-locations=classpath:/static/


# =====================================
# EMAIL CONFIGURATION
# =====================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


# =====================================
# ACTIVE PROFILE
# =====================================
spring.profiles.active=secret


# =====================================
# ADMIN BASIC DETAILS (SAFE)
# =====================================
app.admin.username=admin
app.admin.email=admin@srems.com
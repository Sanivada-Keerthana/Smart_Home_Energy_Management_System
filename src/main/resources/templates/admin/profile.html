<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="content">

  <div class="profile-wrapper">

    <!-- HEADER -->
    <div class="card profile-header">
      <img th:src="@{/images/avatar.png}" class="profile-avatar" alt="Avatar">

      <div class="profile-meta">
        <h2 th:text="${user.username}">Admin</h2>
        <span th:text="${user.role}">ADMIN</span>
      </div>
    </div>

    <!-- FORM -->
    <form th:action="@{/profile/update}" method="post" id="profileForm">

      <div class="card">

        <div class="profile-form">
          <div>
            <label>Username</label>
            <input name="username"
                   th:value="${user.username}"
                   class="editable"
                   readonly>
          </div>

          <div>
            <label>Email</label>
            <input name="email"
                   th:value="${user.email}"
                   class="editable"
                   readonly>
          </div>
        </div>

        <!-- PASSWORD -->
        <div class="security-box hidden" id="security">

          <div class="profile-form full">
            <div>
              <label>New Password</label>
              <input type="password" name="password"
                     placeholder="Enter new password">
            </div>

            <div>
              <label>Confirm Password</label>
              <input type="password" name="confirmPassword"
                     placeholder="Confirm password">
            </div>
          </div>

        </div>

        <!-- ACTIONS -->
        <div class="profile-actions">
          <button type="button"
                  id="editBtn"
                  onclick="editProfile()"
                  class="btn-edit">
            Edit Profile
          </button>

          <button type="submit"
                  id="saveBtn"
                  class="btn-save hidden">
            Save Changes
          </button>
        </div>

      </div>

    </form>

  </div>

<script>
function editProfile(){
  document.querySelectorAll('.editable')
    .forEach(i => i.removeAttribute('readonly'));

  document.getElementById('security').classList.remove('hidden');
  document.getElementById('saveBtn').classList.remove('hidden');
  document.getElementById('editBtn').classList.add('hidden');
}
</script>

</div>
</body>
</html>
